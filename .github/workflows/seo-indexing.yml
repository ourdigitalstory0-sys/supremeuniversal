name: SEO Indexing Engine

on:
  push:
    branches:
      - main
  schedule:
    # Runs at 00:00 UTC every day (approx. 5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  force-index:
    name: Run Google & Bing Indexing APIs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Sitemap Matrix Fresh
        run: npm run prebuild

      - name: Create Google Service Account Key
        run: echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}" > service-account.json

      - name: Execute Google Indexing API
        run: node scripts/google-indexing-api.mjs
        env:
          NODE_ENV: production

      - name: Execute IndexNow API (Bing/Yandex/Naver)
        run: node scripts/force-index.mjs
        env:
          NODE_ENV: production

      - name: Cleanup Secrets
        run: rm -f service-account.json

      - name: Commit & Push Stateful Indexing Progress
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/indexing_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "SEO Engine: Nightly index batch progress update [skip ci]" && git push)
