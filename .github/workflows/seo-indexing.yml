name: SEO Indexing Engine

on:
  schedule:
    # Runs at 00:00 UTC every day (approx. 5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  force-index:
    name: Run Google & Bing Indexing APIs
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Create Google Service Account Key
        # This takes the base64 encoded JSON string from GitHub Secrets and reconstructs the file
        run: echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}" > service-account.json

      - name: Execute Google Indexing API
        run: node scripts/google-indexing-api.mjs
        env:
          NODE_ENV: production

      - name: Execute IndexNow API (Bing/Yandex/Naver)
        run: node scripts/force-index.mjs
        env:
          NODE_ENV: production

      - name: Cleanup Secrets
        run: rm -f service-account.json
